name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Prefer a PAT stored in repository secret GH_PAGES_PAT. If you don't
          # provide it, the action will fall back to the default GITHUB_TOKEN.
          # NOTE: If your repo blocks the GITHUB_TOKEN from pushing, create a
          # Personal Access Token and add it as repository secret `GH_PAGES_PAT`.
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_branch: gh-pages
          publish_dir: ./build
