[build]
  publish = "build"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Do NOT force this redirect — let Netlify serve existing static files (assets)

[build.environment]
  NODE_VERSION = "18" # Ensure modern Node.js for build

# Netlify will use this to build the site and serve index.html for SPA routing